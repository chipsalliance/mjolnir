name: 'Mjolnir PR Security Audit'
description: 'Runs Mjolnir AI Security Audit on PR diffs'

inputs:
  job:
    description: 'Nix job runner target (e.g. opentitan-ci, caliptra-sw-ci, caliptra-dpe-ci, caliptra-mcu-sw-ci)'
    required: true
  base-ref:
    description: 'Base git commit SHA or ref for PR diff comparison'
    required: false
    default: '${{ github.event.pull_request.base.sha || github.event.before }}'
  head-ref:
    description: 'Head git commit SHA or ref for PR diff comparison'
    required: false
    default: '${{ github.event.pull_request.head.sha || github.sha }}'
  gcs-bucket:
    description: 'Optional Google Cloud Storage bucket to upload audit artifacts to'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Install Nix
      uses: cachix/install-nix-action@v27
      with:
        nix_path: nixpkgs=channel:nixos-unstable

    - name: Run Mjolnir Audit
      shell: bash
      run: |
        nix run ${{ github.action_path }}#${{ inputs.job }} -- \
          --diff-base "${{ inputs.base-ref }}" \
          --diff-head "${{ inputs.head-ref }}"

    - name: Sync Audit Artifacts to GCS
      if: ${{ inputs.gcs-bucket != '' }}
      shell: bash
      run: |
        nix run ${{ github.action_path }}#deploy-gcs-runs -- --bucket "${{ inputs.gcs-bucket }}"
        