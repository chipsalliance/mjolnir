<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mjolnir Security Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>M</text></svg>">
  <link rel="stylesheet" href="web/style.css">
  <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
</head>
<body>
  <div class="app-layout">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo">Mjolnir Security</div>
        <div class="subtitle">AI Audit Platform</div>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section-label">NAVIGATION</div>
        <a href="#/" class="nav-item active" id="nav-global">
          <span>Overview</span>
        </a>
        <a href="#/projects" class="nav-item" id="nav-all-projects">
          <span>All Projects</span>
        </a>
        <a href="#/runs" class="nav-item" id="nav-all-runs">
          <span>All Runs</span>
        </a>
        
        <div class="nav-section-label">PROJECTS</div>
        <div id="project-nav-list" class="nav-list">
          <div class="nav-subitem">Loading...</div>
        </div>

        <div class="nav-section-label">RECENT RUNS</div>
        <div id="recent-runs-nav-list" class="nav-list">
          <div class="nav-subitem">No Runs Yet</div>
        </div>
      </nav>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <header class="top-header">
        <div class="header-title" id="page-title">Global Security Overview</div>
      </header>

      <div class="content-body" id="app-viewport">
        <div class="empty-state">
          <h3>No Runs Yet</h3>
          <p>Scan outputs will appear here when benchmarks complete.</p>
        </div>
      </div>

      <footer class="app-footer">
        <div class="footer-left">
          <span>Built: <strong id="footer-last-updated">--</strong></span>
        </div>
        <div class="footer-right">
          <a href="https://github.com/chipsalliance/mjolnir" target="_blank" rel="noopener noreferrer" class="footer-link">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
            Mjolnir GitHub
          </a>
        </div>
      </footer>
    </main>
  </div>

  <!-- Detail Modal -->
  <div id="vulnerability-modal" class="modal-backdrop hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-title">Finding Detail</h3>
        <button id="modal-close" class="modal-close-btn">&times;</button>
      </div>
      <div class="modal-body" id="modal-body">
        <!-- Content dynamically injected -->
      </div>
    </div>
  </div>

  <script type="module" src="web/app.js"></script>
</body>
</html>
